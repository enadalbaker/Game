<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة الصيد: جراح وعزوز</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#111;color:#fff;touch-action:manipulation;user-select:none}
#stage{position:fixed;inset:0;background:linear-gradient(#6ec6ff 0%,#bfe9ff 60%,#8fd16a 60%,#5aa93c 100%);overflow:hidden}
.trees{position:absolute;left:0;right:0;bottom:22%;display:flex;justify-content:space-around;font-size:clamp(70px,16vw,150px);z-index:1;line-height:1;pointer-events:none}
.bushes{position:absolute;left:0;right:0;bottom:0;height:24%;z-index:5;display:flex;justify-content:space-around;align-items:flex-end;font-size:clamp(60px,14vw,120px);background:linear-gradient(transparent,#3f8a2a 35%);pointer-events:none}
#t{position:absolute;z-index:3;width:clamp(90px,19vw,150px);transition:left .8s ease-in-out,top .8s ease-in-out;cursor:crosshair}
#t img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 10px #0006;display:block;pointer-events:none}
#t.hit{transition:top .9s ease-in,transform .9s;transform:rotate(540deg) scale(.6)}
#t.laugh img{animation:sh .32s infinite}
@keyframes sh{0%,100%{transform:translate(-6px,0) rotate(-7deg) scale(1.05,.95)}25%{transform:translate(0,-14px) rotate(0) scale(.97,1.05)}50%{transform:translate(6px,0) rotate(7deg) scale(1.05,.95)}75%{transform:translate(0,-14px) rotate(0) scale(.97,1.05)}}
#bub{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:#fff;color:#222;padding:4px 12px;border-radius:14px;font-weight:700;white-space:nowrap;display:none}
#t.laugh #bub{display:block}
#hud{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;z-index:9;display:flex;justify-content:space-between;font-weight:700;text-shadow:0 2px 4px #000a;font-size:18px;pointer-events:none}
#msg{position:absolute;top:40%;width:100%;text-align:center;font-size:clamp(28px,8vw,60px);font-weight:800;z-index:9;text-shadow:0 3px 8px #000;pointer-events:none}
.ov{position:fixed;inset:0;z-index:20;background:linear-gradient(#1b2a49,#0d1424);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;padding-top:max(20px,env(safe-area-inset-top));overflow:auto}
.ov.off{display:none}
h1{margin:0;font-size:clamp(26px,7vw,44px)}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.card{background:#ffffff14;border:2px solid #ffffff33;border-radius:18px;padding:14px;width:min(44vw,210px);text-align:center}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid #fff;margin-bottom:8px}
.card button.play{width:100%;padding:12px;font-size:18px;font-weight:700;border:0;border-radius:12px;background:#ffb703;color:#222;cursor:pointer}
.up{display:flex;gap:6px;margin-top:8px}
.up label{flex:1;font-size:12px;background:#ffffff22;border-radius:8px;padding:6px 2px;cursor:pointer}
.up input{display:none}
p.s{margin:0;opacity:.8;font-size:14px;text-align:center;max-width:460px}
.big{padding:12px 28px;font-size:18px;font-weight:700;border:0;border-radius:12px;background:#ffb703;color:#222;cursor:pointer}
</style>
</head>
<body>
<div id="stage">
  <div id="hud"><span id="hs">الصيد: 0</span><span id="hr">الجولة 1/10</span><span id="hb">🔫 2</span></div>
  <div class="trees"><span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span></div>
  <div id="t" style="display:none;left:40%;top:80%"><div id="bub">هههههه 😂</div><img id="ti" alt=""></div>
  <div class="bushes"><span>🌿</span><span>🌱</span><span>🌿</span><span>🌱</span><span>🌿</span></div>
  <div id="msg"></div>
</div>

<div class="ov" id="start">
  <h1>🎯 لعبة الصيد</h1>
  <p class="s">اختر اسمك. جراح يصيد عزوز، وعزوز يصيد جراح. اضغط على الشاشة لما يظهر!</p>
  <div class="row">
    <div class="card"><img id="p-jarrah" alt="جراح"><button class="play" onclick="go('jarrah')">أنا جراح</button></div>
    <div class="card"><img id="p-azouz" alt="عزوز"><button class="play" onclick="go('azouz')">أنا عزوز</button></div>
  </div>
</div>

<div class="ov off" id="end">
  <h1 id="et"></h1><p class="s" id="es"></p>
  <button class="big" onclick="go(me)">العب مرة ثانية</button>
  <button class="big" style="background:#ffffff22;color:#fff" onclick="home()">الصفحة الرئيسية</button>
</div>

try{const s=JSON.parse(localStorage.getItem('huntImgs')||'{}');for(const k in s){if(imgs[k]){if(s[k].n)imgs[k].n=s[k].n;if(s[k].l)imgs[k].l=s[k].l}}}catch(e){}
function save(){try{localStorage.setItem('huntImgs',JSON.stringify({jarrah:{n:imgs.jarrah.n.startsWith('data:image/jpeg')?imgs.jarrah.n:null,l:imgs.jarrah.l},azouz:{n:imgs.azouz.n.startsWith('data:image/jpeg')?imgs.azouz.n:null,l:imgs.azouz.l}}))}catch(e){}}
function paint(){document.getElementById('p-jarrah').src=imgs.jarrah.n;document.getElementById('p-azouz').src=imgs.azouz.n}
function up(who,kind,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=300;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,300,300);imgs[who][kind]=c.toDataURL('image/jpeg',.85);paint();save()};im.src=r.result};r.readAsDataURL(f)}
paint();

const $=id=>document.getElementById(id),t=$('t'),ti=$('ti'),stage=$('stage');
let me,tg,round,score,shots,busy,mv,to,ROUNDS=10;
function beep(f,d){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function hud(){$('hs').textContent='الصيد: '+score;$('hr').textContent='الجولة '+Math.min(round,ROUNDS)+'/'+ROUNDS;$('hb').textContent='🔫 '+shots}
function go(who){me=who;tg=who==='jarrah'?'azouz':'jarrah';round=0;score=0;$('start').classList.add('off');$('end').classList.add('off');next()}
function home(){clearInterval(mv);clearTimeout(to);t.style.display='none';$('end').classList.add('off');$('start').classList.remove('off')}
function rnd(a,b){return a+Math.random()*(b-a)}
function place(){t.style.left=rnd(4,72)+'%';t.style.top=rnd(18,52)+'%'}
function next(){
  clearInterval(mv);clearTimeout(to);round++;
  if(round>ROUNDS){return finish()}
  shots=2;busy=false;hud();$('msg').textContent='';var f=Math.max(.35,1-(round-1)*.07);
  t.className='';t.style.transition='none';t.style.display='block';t.style.left=rnd(10,70)+'%';t.style.top='78%';ti.src=imgs[tg].n;
  setTimeout(()=>{t.style.transition='';t.style.transitionDuration=(.8*f)+'s';place();mv=setInterval(place,(rnd(700,1000)*f)|0)},350);
  to=setTimeout(()=>miss(),9000*Math.max(.55,f));
}
function miss(){
  if(busy)return;busy=true;clearInterval(mv);clearTimeout(to);
  ti.src=imgs[tg].l||imgs[tg].n;t.className='laugh';
  t.style.left=(parseFloat(t.style.left)||40)+'%';t.style.top='48%';
  $('msg').textContent=NAMES[tg]+' يضحك عليك! 😂';beep(150,.4);
  setTimeout(()=>{t.style.top='85%';setTimeout(next,700)},2200);
}
t.addEventListener('pointerdown',e=>{
  e.stopPropagation();if(busy)return;
  busy=true;clearInterval(mv);clearTimeout(to);score++;hud();beep(700,.15);
  $('msg').textContent='🎯 صدته!';
  const r=t.getBoundingClientRect();t.style.left=r.left+'px';t.style.top=r.top+'px';
  t.className='hit';t.style.top='105%';
  setTimeout(next,1100);
});
stage.addEventListener('pointerdown',()=>{
  if(busy||!me)return;
  shots--;hud();beep(300,.1);
  if(shots<=0)miss();
});
function finish(){
  t.style.display='none';
  $('et').textContent=score>=7?'🏆 صياد ماهر!':score>=4?'👍 مو بطال':'😂 '+NAMES[tg]+' فاز عليك';
  $('es'+'').textContent=NAMES[me]+': صدت '+NAMES[tg]+' '+score+' من '+ROUNDS+' مرات';
  $('end').classList.remove('off');
}
</script>
