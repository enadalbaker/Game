<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة الصيد: جراح وعزوز</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="لعبة الصيد">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#111;color:#fff;touch-action:manipulation;user-select:none}
#stage{position:fixed;inset:0;background:linear-gradient(#6ec6ff 0%,#bfe9ff 60%,#8fd16a 60%,#5aa93c 100%);overflow:hidden}
.trees{position:absolute;left:0;right:0;bottom:22%;display:flex;justify-content:space-around;font-size:clamp(70px,16vw,150px);z-index:1;line-height:1;pointer-events:none}
.bushes{position:absolute;left:0;right:0;bottom:0;height:24%;z-index:5;display:flex;justify-content:space-around;align-items:flex-end;font-size:clamp(60px,14vw,120px);background:linear-gradient(transparent,#3f8a2a 35%);pointer-events:none}
#t{position:absolute;z-index:3;width:clamp(72px,15vw,115px);transition:left .8s ease-in-out,top .8s ease-in-out;cursor:crosshair}
#t img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 10px #0006;display:block;pointer-events:none}
#t.hit{transition:top .9s ease-in,transform .9s;transform:rotate(540deg) scale(.6)}
#t.laugh img{animation:sh .32s infinite}
@keyframes sh{0%,100%{transform:translate(-6px,0) rotate(-7deg) scale(1.05,.95)}25%{transform:translate(0,-14px) rotate(0) scale(.97,1.05)}50%{transform:translate(6px,0) rotate(7deg) scale(1.05,.95)}75%{transform:translate(0,-14px) rotate(0) scale(.97,1.05)}}
#bub{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:#fff;color:#222;padding:4px 12px;border-radius:14px;font-weight:700;white-space:nowrap;display:none}
#t.laugh #bub{display:block}
#hud{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;z-index:9;display:flex;justify-content:space-between;font-weight:700;text-shadow:0 2px 4px #000a;font-size:18px;pointer-events:none}
#msg{position:absolute;top:40%;width:100%;text-align:center;font-size:clamp(28px,8vw,60px);font-weight:800;z-index:9;text-shadow:0 3px 8px #000;pointer-events:none}
.ov{position:fixed;inset:0;z-index:20;background:linear-gradient(#1b2a49,#0d1424);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;padding-top:max(20px,env(safe-area-inset-top));overflow:auto}
.ov.off{display:none}
h1{margin:0;font-size:clamp(26px,7vw,44px)}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.card{background:#ffffff14;border:2px solid #ffffff33;border-radius:18px;padding:14px;width:min(44vw,210px);text-align:center}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid #fff;margin-bottom:8px}
.card button.play{width:100%;padding:12px;font-size:18px;font-weight:700;border:0;border-radius:12px;background:#ffb703;color:#222;cursor:pointer}
.up{display:flex;gap:6px;margin-top:8px}
.up label{flex:1;font-size:12px;background:#ffffff22;border-radius:8px;padding:6px 2px;cursor:pointer}
.up input{display:none}
p.s{margin:0;opacity:.8;font-size:14px;text-align:center;max-width:460px}
.big{padding:12px 28px;font-size:18px;font-weight:700;border:0;border-radius:12px;background:#ffb703;color:#222;cursor:pointer}
.fc{position:absolute}.fc img,.bl img{aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid #fff;display:block;pointer-events:none}.fc img{width:100%;box-shadow:0 3px 8px #0006}
.lg img{animation:sh .32s infinite}
#mg{position:absolute;inset:0;z-index:6;display:none;touch-action:none}
#gr{position:absolute;left:5%;right:5%;top:18%;bottom:27%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2%}
.ho{position:relative;overflow:hidden;background:radial-gradient(ellipse 50% 28% at 50% 92%,#3b2a1a 98%,transparent 100%)}
.ho .fc{left:15%;width:70%;bottom:-80%;transition:bottom .15s}.ho .fc.up{bottom:12%}.ho .fc{transition:bottom .08s}
#bk{position:absolute;bottom:7%;transform:translateX(-50%);font-size:72px;z-index:7;pointer-events:none}
.bl{position:absolute;aspect-ratio:.82;border-radius:50% 50% 48% 48%;display:flex;align-items:center;justify-content:center;z-index:6;box-shadow:inset -8px -8px 14px #0003;cursor:pointer}.bl img{width:72%}
.bl::after{content:"";position:absolute;bottom:-24px;left:50%;width:2px;height:24px;background:#fff8}.bl.pop{transform:scale(1.5);opacity:0;transition:.2s}
</style>
</head>
<body>
<div id="stage">
  <div id="hud"><span id="hs">الصيد: 0</span><span id="hr">الجولة 1/10</span><span id="hb">🔫 2</span></div>
  <div class="trees"><span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span></div>
  <div id="t" style="display:none;left:40%;top:80%"><div id="bub">هههههه 😂</div><img id="ti" alt=""></div>
  <div class="bushes"><span>🌿</span><span>🌱</span><span>🌿</span><span>🌱</span><span>🌿</span></div>
  <div id="mg"></div>
  <div id="msg"></div>
</div>

<div class="ov" id="start">
  <h1>🎯 لعبة الصيد</h1>
  <p class="s">اختر اسمك. جراح يصيد عزوز، وعزوز يصيد جراح. اضغط على الشاشة لما يظهر!</p>
  <div class="row">
    <div class="card"><img id="p-jarrah" alt="جراح" onclick="go('jarrah')" style="cursor:pointer"><button class="play" onclick="go('jarrah')">أنا جراح</button></div>
    <div class="card"><img id="p-azouz" alt="عزوز" onclick="go('azouz')" style="cursor:pointer"><button class="play" onclick="go('azouz')">أنا عزوز</button></div>
  </div>
</div>

<div class="ov off" id="end">
  <h1 id="et"></h1><p class="s" id="es"></p>
  <button class="big" id="eb" onclick="go(me)">العب مرة ثانية</button>
  <button class="big" style="background:#ffffff22;color:#fff" onclick="home()">الصفحة الرئيسية</button>
</div>

    requestAnimationFrame(()=>requestAnimationFrame(()=>fs.forEach(f=>f.classList.add('up'))));

function s3(){
  const g=$('mg'),bk=document.createElement('div'),W=innerWidth,H=innerHeight;let bx=W/2;
  const half=W<600?48:58;
  bk.id='bk';bk.textContent='🧺';bk.style.left=bx+'px';g.appendChild(bk);
  g.onpointermove=g.onpointerdown=e=>{bx=e.clientX;bk.style.left=bx+'px'};
  run(30,()=>{
    const sz=W<600?64:80,bad=Math.random()<.3,f=fe(sz,bad?me:tg);
    f.bad=bad;f.sz=sz;f.x0=rnd(sz,W-sz);f.x=f.x0;f.y=-sz;f.t=0;f.ph=rnd(0,6.28);
    f.amp=Math.random()<.5?0:rnd(20,60);f.v0=H*.5;
    f.style.left=(f.x-sz/2)+'px';f.style.top=f.y+'px';return f},
  (f,dt)=>{
    f.t+=dt;f.y+=f.v*dt;f.x=f.x0+Math.sin(f.t*3+f.ph)*f.amp;
    f.style.left=(f.x-f.sz/2)+'px';f.style.top=f.y+'px';
    if(f.y>H*.74&&f.y<H*.9&&Math.abs(f.x-bx)<half){
      f.done=1;gL++;
      if(f.bad){gs=Math.max(0,gs-1);beep(120,.25)}else{gs++;beep(700,.1)}
      hudm();f.remove()}
    else if(f.y>=H*.9){
      f.done=1;gL++;hudm();
      if(f.bad)f.remove();else{lf(f,1200);setTimeout(()=>f.remove(),1300)}}
  },1.0,.38);
}
function s4(){
  const W=innerWidth,H=innerHeight;
  run(30,()=>{
    const sz=W<600?74:90,bad=Math.random()<.3,b=document.createElement('div');
    b.className='bl';b.style.width=sz+'px';
    b.style.background='hsl('+(Math.random()*360|0)+',75%,55%)';
    b.innerHTML='<img src="'+imgs[bad?me:tg].n+'">';
    b.bad=bad;b.sz=sz;b.x0=rnd(sz,W-sz);b.x=b.x0;b.y=H;b.t=0;b.ph=rnd(0,6.28);b.amp=rnd(15,50);b.v0=H*.3;
    b.style.left=(b.x-sz/2)+'px';b.style.top=H+'px';
    b.onpointerdown=e=>{
      e.stopPropagation();if(b.done)return;b.done=1;gL++;
      if(b.bad){gs=Math.max(0,gs-1);beep(120,.25)}else{gs++;beep(900,.08)}
      hudm();b.classList.add('pop');setTimeout(()=>b.remove(),200)};
    return b},
  (b,dt)=>{
    b.t+=dt;b.y-=b.v*dt;b.x=b.x0+Math.sin(b.t*4+b.ph)*b.amp;
    b.style.left=(b.x-b.sz/2)+'px';b.style.top=b.y+'px';
    if(b.y<H*.1){
      b.done=1;gL++;hudm();
      if(b.bad)b.remove();else{b.style.background='none';lf(b,1000);setTimeout(()=>b.remove(),1000)}}
  },.9,.32);
}
</script>
